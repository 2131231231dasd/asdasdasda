<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background-color: #050608;
  color: #ededed;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  overflow-x: hidden;
}

.adderall-grid-background {
  background-color: #050608;
  background-image:
    linear-gradient(to right, rgba(255, 255, 255, 0.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
  background-size: 38px 38px;
  background-position: center top;
}

.screen-perimeter-shading {
  background: radial-gradient(circle at 50% 25%, transparent 25%, rgba(5, 6, 8, 0.78) 85%);
}

.ambient-background-glow {
  position: fixed;
  top: -80px;
  left: 50%;
  transform: translateX(-50%);
  width: 1250px;
  height: 680px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(85px);
  opacity: 0.9;
}

@keyframes tab_fade_blur_in {
  0% { opacity: 0; filter: blur(8px); transform: translateY(4px); }
  100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
}

.tab-transition-blur {
  animation: tab_fade_blur_in 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes backdrop_blur_in {
  0% { opacity: 0; backdrop-filter: blur(0px); }
  100% { opacity: 1; backdrop-filter: blur(10px); }
}

@keyframes modal_scale_in {
  0% { opacity: 0; transform: scale(0.95) translateY(8px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-backdrop-blur {
  animation: backdrop_blur_in 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.modal-panel-anim {
  animation: modal_scale_in 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

button { font-family: inherit; border: none; background: none; }

input { font-family: inherit; }

code, pre, .font-mono { font-family: "JetBrains Mono", Consolas, monospace; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
</style>

function load_monaco() {
  if (window.__monaco_loading) return window.__monaco_loading;
  window.__monaco_loading = new Promise((resolve, reject) => {
    if (window.monaco && window.monaco.editor) {
      resolve(window.monaco);
      return;
    }
    const script = document.createElement('script');
    script.src = monaco_base + '/loader.js';
    script.onerror = () => reject(new Error('monaco loader failed'));
    script.onload = () => {
      window.require.config({ paths: { vs: monaco_base } });
      window.require(['vs/editor/editor.main'], () => resolve(window.monaco), reject);
    };
    document.head.appendChild(script);
  });
  return window.__monaco_loading;
}

function apply_theme(monaco, theme) {
  monaco.editor.defineTheme('dynamic-prada-theme', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: 'keyword', foreground: theme.monaco_keyword.replace('#', ''), fontStyle: 'bold' },
      { token: 'string', foreground: theme.monaco_string.replace('#', '') },
      { token: 'string.escape', foreground: 'e2e8f0' },
      { token: 'number', foreground: theme.monaco_number.replace('#', '') },
      { token: 'comment', foreground: '4f5565', fontStyle: 'italic' },
      { token: 'delimiter', foreground: '818cf8' },
      { token: 'identifier', foreground: 'e0e4ef' },
      { token: 'type', foreground: 'c084fc' },
    ],
    colors: {
      'editor.background': theme.bg_editor,
      'editor.foreground': '#d1d5db',
      'editor.lineHighlightBackground': '#0e1118',
      'editorLineNumber.foreground': '#323644',
      'editorLineNumber.activeForeground': '#93a4db',
      'editorGutter.background': theme.bg_editor,
      'editorCursor.foreground': theme.monaco_number,
      'editor.selectionBackground': '#181e2e',
      'minimap.background': theme.bg_editor,
      'scrollbarSlider.background': '#151824',
      'scrollbarSlider.hoverBackground': '#202536',
      'scrollbarSlider.activeBackground': '#2d344d',
    },
  });
}

function MonacoEditor({ value, on_change, theme, height }) {
  const host = useRef(null);
  const instance = useRef(null);
  const change_ref = useRef(on_change);
  const theme_ref = useRef(theme);

  change_ref.current = on_change;
  theme_ref.current = theme;

  useEffect(() => {
    let disposed = false;
    load_monaco()
      .then((monaco) => {
        if (disposed || !host.current) return;
        apply_theme(monaco, theme_ref.current);
        const ed = monaco.editor.create(host.current, {
          value: value,
          language: 'lua',
          theme: 'dynamic-prada-theme',
          fontSize: 13,
          fontFamily: "'JetBrains Mono', Consolas, monospace",
          minimap: { enabled: true, side: 'right', maxColumn: 80 },
          scrollBeyondLastLine: false,
          smoothScrolling: true,
          lineNumbers: 'on',
          lineNumbersMinChars: 3,
          folding: true,
          cursorBlinking: 'smooth',
          tabSize: 4,
          renderLineHighlight: 'line',
          padding: { top: 16, bottom: 16 },
          automaticLayout: true,
          overviewRulerBorder: false,
          hideCursorInOverviewRuler: true,
          scrollbar: { verticalScrollbarSize: 8, horizontalScrollbarSize: 8 },
        });
        ed.onDidChangeModelContent(() => {
          change_ref.current(ed.getValue());
        });
        instance.current = ed;
      })
      .catch((err) => console.error('[adderall] monaco failed to load', err));
    return () => {
      disposed = true;
      if (instance.current) {
        instance.current.dispose();
        instance.current = null;
      }
    };
  }, []);

  useEffect(() => {
    const ed = instance.current;
    if (ed && value !== ed.getValue()) ed.setValue(value);
  }, [value]);

  useEffect(() => {
    const ed = instance.current;
    if (!ed || !window.monaco) return;
    apply_theme(window.monaco, theme);
    window.monaco.editor.setTheme('dynamic-prada-theme');
  }, [theme]);

  return <div ref={host} style={{ height: height || '650px', width: '100%' }} />;
}

async function push_live_config(config) {
  const targets = ['/api/live-config', 'http://localhost:3000/api/live-config'];
  for (const target of targets) {
    try {
      const res = await fetch(target, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ config }),
      });
      if (res.ok) return true;
    } catch {
      continue;
    }
  }
  return false;
}
